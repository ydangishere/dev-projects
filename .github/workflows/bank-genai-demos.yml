name: Bank GenAI demos
on:
  push:
    paths: ['bank-credit-copilot/**', 'bank-virtual-assistant/**', '.github/workflows/bank-genai-demos.yml']
  pull_request:
    paths: ['bank-credit-copilot/**', 'bank-virtual-assistant/**', '.github/workflows/bank-genai-demos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [bank-credit-copilot, bank-virtual-assistant]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app scripts tests
      - run: node --check static/app.js
      - run: python -m pytest -q
      - run: python scripts/evaluate.py
