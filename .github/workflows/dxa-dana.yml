# Kiểm DXA bản Dana: agent dxa_agent.na chạy thật bằng Dana runtime.
name: DXA Dana agent

on:
  push:
    branches: [main]
    paths: ['dxa-automative-agent_dana/**', '.github/workflows/dxa-dana.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dxa-automative-agent_dana
    env:
      PYTHONUTF8: '1'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cài thư viện (gồm Dana 0.6.0.3.post3)
        run: pip install -r requirements.txt

      - name: Dựng kho tri thức, kiểm dữ liệu, chấm bản offline
        run: |
          python dxa.py build
          python validate.py
          python eval.py

      - name: Hiệu năng RAG offline - 10 câu liên tiếp, bypass Dana
        env: { GEMINI_API_KEY: '', GOOGLE_API_KEY: '', DANA_MOCK_LLM: '' }
        run: python test_perf.py

      - name: Kiểm thử Agentic Planning, Replanning, Memory (offline)
        run: python test_agentic.py

      - name: Agent Dana với LLM giả (DANA_MOCK_LLM)
        env: { DANA_MOCK_LLM: 'true', GEMINI_API_KEY: '' }
        run: python test_dana.py

      - name: Agent Dana không có key (câu ghép khuôn)
        env: { GEMINI_API_KEY: '' }
        run: python test_dana.py

      - name: Chạy bằng lệnh dana
        env: { DANA_MOCK_LLM: 'true', GEMINI_API_KEY: '' }
        run: |
          python -c "import dxa_dana; dxa_dana.configure()"
          export DANA_CONFIG=$PWD/index/dana_config.json
          dana dxa_agent.na question="Bình xăng con chảy xăng khi dựng xe" 2>&1 | grep -vE "^\{'local'|Final Context|^-{5,}" | tail -25

      - name: Giao diện web + API ưu tiên RAG offline
        env: { DANA_MOCK_LLM: 'true', GEMINI_API_KEY: '' }
        run: |
          uvicorn api:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 2; done
          echo
          curl -sf localhost:8000/ | grep -q "Xe bạn đang bị gì"
          curl -sf -X POST localhost:8000/ask -H 'Content-Type: application/json' \
            -d '{"question":"Bình xăng con chảy xăng khi dựng xe"}' > ask.json
          python -c "import json;r=json.load(open('ask.json'));print(r['answered_by'],r['mode'],r['timings_ms']);assert r['mode']=='offline' and r['answered_by'] in ('template','gate') and r['timings_ms']['total_ms']>=0,r"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/unanswered)" = 401
          grep -q "Mã đăng nhập thợ" api.log
          tail -5 api.log

      - name: Tab Bổ sung kiến thức (phân quyền thợ, lưu, dựng lại kho)
        env: { DANA_MOCK_LLM: 'true', GEMINI_API_KEY: '' }
        run: python test_expert.py

      - name: dana deploy (REST /solve) — Dana 0.6.0.3 lỗi khi gọi solve() tự viết
        continue-on-error: true
        env: { DANA_MOCK_LLM: 'true', GEMINI_API_KEY: '' }
        run: |
          export DANA_CONFIG=$PWD/index/dana_config.json
          dana deploy dxa_agent.na --port 8100 > deploy.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8100/ && break; sleep 2; done
          echo
          curl -sf -X POST localhost:8100/solve -H 'Content-Type: application/json' \
            -d '{"query":"Bình xăng con chảy xăng khi dựng xe"}' > solve.json || { curl -s -X POST localhost:8100/solve -H 'Content-Type: application/json' -d '{"query":"xe chay xang"}'; tail -40 deploy.log; exit 1; }
          python -c "import json;r=json.load(open('solve.json'));print(r['result']);assert '[C02]' in r['result'], r"
          tail -5 deploy.log

      - name: Agent Dana với Gemini thật (khi repo có secret GEMINI_API_KEY)
        if: env.GEMINI_API_KEY != ''
        run: python test_dana.py

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dxa-automative-agent_dana
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cài thư viện (gồm Dana)
        run: pip install -r requirements.txt
      - name: Dựng kho tri thức
        run: python dxa.py build
      - name: Agent Dana trên Windows (LLM giả)
        env: { DANA_MOCK_LLM: 'true' }
        run: python test_dana.py
      - name: Agent Dana trên Windows (không key)
        run: python test_dana.py
