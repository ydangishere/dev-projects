name: DXA security scan
on:
  push:
    paths:
      - 'dxa-automative-agent/**'
      - 'dxa-automative-agent_dana/**'
      - '.github/workflows/dxa-security.yml'
  pull_request:
    paths:
      - 'dxa-automative-agent/**'
      - 'dxa-automative-agent_dana/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  code-and-libraries:
    strategy:
      fail-fast: false
      matrix:
        app: [dxa-automative-agent, dxa-automative-agent_dana]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.16.9 pip-audit
      - name: Ruff - code DXA có dòng nào dễ bị lợi dụng
        run: ruff check --select S --ignore S110 .
      - name: pip-audit - thư viện có lỗ hổng đã công bố
        if: matrix.app == 'dxa-automative-agent'
        run: pip-audit -r requirements.txt
      # Bản Dana: Pillow bị Dana (qua aicapture) khoá ở bản <12 nên chưa nâng được.
      # DXA không mở file ảnh nên lỗi Pillow không bị chạm tới. Vẫn in ra để theo dõi,
      # chỉ báo đỏ khi có thư viện KHÁC Pillow bị lỗi.
      - name: pip-audit - thư viện có lỗ hổng đã công bố (bỏ qua Pillow)
        if: matrix.app == 'dxa-automative-agent_dana'
        run: |
          pip-audit -r requirements.txt -f json -o audit.json || true
          python - <<'PY'
          import json, sys
          deps = json.load(open("audit.json"))["dependencies"]
          bad = [(d["name"], d["version"], v["id"]) for d in deps for v in d.get("vulns", [])]
          for b in bad:
              print(*b)
          other = [b for b in bad if b[0].lower() != "pillow"]
          print(f"Pillow: {len(bad) - len(other)} lỗi (chờ Dana nâng). Thư viện khác: {len(other)} lỗi.")
          sys.exit(1 if other else 0)
          PY

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cài gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R gitleaks/gitleaks -p '*_linux_x64.tar.gz' -O gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: gitleaks - key có bị lọt vào git không
        run: >
          ./gitleaks git . --redact --verbose
          --log-opts="--all -- dxa-automative-agent dxa-automative-agent_dana"
