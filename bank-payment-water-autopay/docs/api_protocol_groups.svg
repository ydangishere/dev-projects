<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770" role="img" aria-label="Sơ đồ công nghệ cho 45 API AutoPay: REST, Internal HTTP, Webhook, gRPC, Kafka, WebSocket">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#577590"/></marker></defs>
<rect width="1440" height="770" fill="#F8FAFD"/>
<text x="45" y="55" fill="#0B203C" font-family="Arial,sans-serif" font-weight="700" font-size="31">BANK PAYMENT + WATER AUTOPAY</text>
<text x="45" y="86" fill="#506782" font-family="Arial,sans-serif" font-size="17">Nhóm giao tiếp theo công nghệ • 45 HTTP endpoints đã mô tả • gRPC, Kafka, WebSocket là phương án mở rộng</text>
<g><rect x="45" y="125" width="305" height="148" rx="16" fill="#E8F0FF" stroke="#184A95" stroke-width="1.3"/><text x="63" y="159" fill="#184A95" font-family="Arial,sans-serif" font-size="20" font-weight="700">Bank App • REST (39)</text><text x="63" y="189" fill="#263C53" font-family="Arial,sans-serif" font-size="15">POST /v1/payments</text><text x="63" y="211" fill="#263C53" font-family="Arial,sans-serif" font-size="15">POST /v1/auth/challenges</text><text x="63" y="233" fill="#263C53" font-family="Arial,sans-serif" font-size="15">GET /v1/accounts/{id}/balance</text></g>
<g><rect x="418" y="125" width="300" height="148" rx="16" fill="#ECF1F6" stroke="#334E68" stroke-width="1.3"/><text x="436" y="159" fill="#334E68" font-family="Arial,sans-serif" font-size="20" font-weight="700">API Gateway</text><text x="436" y="189" fill="#263C53" font-family="Arial,sans-serif" font-size="15">Xác thực + phân quyền</text><text x="436" y="211" fill="#263C53" font-family="Arial,sans-serif" font-size="15">Kiểm soát request / token</text><text x="436" y="233" fill="#263C53" font-family="Arial,sans-serif" font-size="15">Định tuyến đến service</text></g>
<g><rect x="787" y="125" width="300" height="148" rx="16" fill="#F1EDFF" stroke="#6F4099" stroke-width="1.3"/><text x="805" y="159" fill="#6F4099" font-family="Arial,sans-serif" font-size="20" font-weight="700">Payment + AutoPay</text><text x="805" y="189" fill="#263C53" font-family="Arial,sans-serif" font-size="15">Mandate • OTP khi đăng ký</text><text x="805" y="211" fill="#263C53" font-family="Arial,sans-serif" font-size="15">Lịch tháng • idempotency</text><text x="805" y="233" fill="#263C53" font-family="Arial,sans-serif" font-size="15">Kiểm tra hạn mức / policy</text></g>
<g><rect x="1155" y="125" width="240" height="148" rx="16" fill="#FFF1D6" stroke="#945C00" stroke-width="1.3"/><text x="1173" y="159" fill="#945C00" font-family="Arial,sans-serif" font-size="20" font-weight="700">Core Banking</text><text x="1173" y="189" fill="#263C53" font-family="Arial,sans-serif" font-size="15">Debit + ledger</text><text x="1173" y="211" fill="#263C53" font-family="Arial,sans-serif" font-size="15">Balance / hold</text><text x="1173" y="233" fill="#263C53" font-family="Arial,sans-serif" font-size="15">gRPC: đề xuất</text></g>
<g><rect x="45" y="345" width="305" height="148" rx="16" fill="#DFF7EB" stroke="#087647" stroke-width="1.3"/><text x="63" y="379" fill="#087647" font-family="Arial,sans-serif" font-size="20" font-weight="700">Biller • Webhook (2)</text><text x="63" y="409" fill="#263C53" font-family="Arial,sans-serif" font-size="15">bill-issued / payment-status</text><text x="63" y="431" fill="#263C53" font-family="Arial,sans-serif" font-size="15">Đối tác gửi HTTP POST</text><text x="63" y="453" fill="#263C53" font-family="Arial,sans-serif" font-size="15">Ký webhook + chống lặp</text></g>
<g><rect x="418" y="345" width="300" height="148" rx="16" fill="#F1EDFF" stroke="#6F4099" stroke-width="1.3"/><text x="436" y="379" fill="#6F4099" font-family="Arial,sans-serif" font-size="20" font-weight="700">Internal HTTP (4)</text><text x="436" y="409" fill="#263C53" font-family="Arial,sans-serif" font-size="15">execute-due / reconciliation</text><text x="436" y="431" fill="#263C53" font-family="Arial,sans-serif" font-size="15">notifications/dispatch</text><text x="436" y="453" fill="#263C53" font-family="Arial,sans-serif" font-size="15">exceptions</text></g>
<g><rect x="787" y="345" width="300" height="148" rx="16" fill="#FFF1D6" stroke="#945C00" stroke-width="1.3"/><text x="805" y="379" fill="#945C00" font-family="Arial,sans-serif" font-size="20" font-weight="700">Kafka (đề xuất)</text><text x="805" y="409" fill="#263C53" font-family="Arial,sans-serif" font-size="15">payment.completed</text><text x="805" y="431" fill="#263C53" font-family="Arial,sans-serif" font-size="15">payment.failed</text><text x="805" y="453" fill="#263C53" font-family="Arial,sans-serif" font-size="15">AutopayRunFinished</text></g>
<g><rect x="1155" y="345" width="240" height="148" rx="16" fill="#E8F0FF" stroke="#184A95" stroke-width="1.3"/><text x="1173" y="379" fill="#184A95" font-family="Arial,sans-serif" font-size="20" font-weight="700">Notifications</text><text x="1173" y="409" fill="#263C53" font-family="Arial,sans-serif" font-size="15">In-app message + push</text><text x="1173" y="431" fill="#263C53" font-family="Arial,sans-serif" font-size="15">WebSocket: app đang mở</text><text x="1173" y="453" fill="#263C53" font-family="Arial,sans-serif" font-size="15">FCM/APNs: app đóng</text></g>
<g><rect x="418" y="575" width="300" height="120" rx="16" fill="#DFF7EB" stroke="#087647" stroke-width="1.3"/><text x="436" y="609" fill="#087647" font-family="Arial,sans-serif" font-size="20" font-weight="700">AI Agent (đề xuất)</text><text x="436" y="639" fill="#263C53" font-family="Arial,sans-serif" font-size="15">Đọc hóa đơn, cảnh báo</text><text x="436" y="661" fill="#263C53" font-family="Arial,sans-serif" font-size="15">Chỉ đề xuất; không debit</text></g>
<g><rect x="787" y="575" width="300" height="120" rx="16" fill="#ECF1F6" stroke="#334E68" stroke-width="1.3"/><text x="805" y="609" fill="#334E68" font-family="Arial,sans-serif" font-size="20" font-weight="700">Policy / Audit</text><text x="805" y="639" fill="#263C53" font-family="Arial,sans-serif" font-size="15">Consent, max amount, risk</text><text x="805" y="661" fill="#263C53" font-family="Arial,sans-serif" font-size="15">Giữ quyền thực thi tại bank</text></g>
