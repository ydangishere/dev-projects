<text x="44" y="743" fill="#536780" font-family="Arial,sans-serif" font-size="15">Đã đặc tả: REST 39 + Internal HTTP 4 + Webhook 2 = 45 HTTP endpoints. Chưa đặc tả: gRPC 0 + WebSocket 0 + Kafka 0.</text></svg>