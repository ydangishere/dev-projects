# Optional local Neo4j service: docker compose -f compose.yaml -f compose.graph.yaml up --build
services:
  checker:
    build:
      context: .
      args:
        INSTALL_NEO4J: "true"
    environment:
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      neo4j:
        condition: service_started
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Set_NEO4J_PASSWORD_in_dotenv}"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    restart: unless-stopped
volumes:
  neo4j-data:
