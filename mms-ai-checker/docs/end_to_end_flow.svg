<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EDF4F7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B203C" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0D3C7D"/>
    </marker>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#0B203C}
      .subtitle{font:400 22px Arial,sans-serif;fill:#47566B}
      .step{font:700 16px Arial,sans-serif;fill:#FFFFFF;letter-spacing:1px}
      .head{font:700 24px Arial,sans-serif;fill:#0B203C}
      .body{font:400 18px Arial,sans-serif;fill:#47566B}
      .tech{font:700 16px Arial,sans-serif;fill:#0D3C7D}
      .footer{font:700 21px Arial,sans-serif;fill:#FFFFFF}
      .small{font:400 16px Arial,sans-serif;fill:#DBEAFE}
    </style>
  </defs>

  <rect width="1600" height="1050" fill="url(#bg)"/>
  <circle cx="1460" cy="70" r="185" fill="#0D3C7D" opacity=".06"/>
  <circle cx="110" cy="980" r="210" fill="#73BF26" opacity=".07"/>

  <text x="80" y="82" class="title">AI KIỂM TRA HỒ SƠ — END-TO-END FLOW</text>
  <text x="80" y="122" class="subtitle">Từ bài toán nghiệp vụ đến hệ thống chạy trên server và được theo dõi thực tế</text>

  <!-- row 1 connectors -->
  <path d="M390 300 H430" stroke="#0D3C7D" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M770 300 H810" stroke="#0D3C7D" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1150 300 H1190" stroke="#0D3C7D" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1360 455 V505 H240 V550" fill="none" stroke="#0D3C7D" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- row 2 connectors -->
  <path d="M390 700 H430" stroke="#0D3C7D" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M770 700 H810" stroke="#0D3C7D" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1150 700 H1190" stroke="#0D3C7D" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- card 1 -->
  <g filter="url(#shadow)">
    <rect x="70" y="190" width="320" height="265" rx="22" fill="#FFFFFF"/>
    <rect x="70" y="190" width="320" height="54" rx="22" fill="#0D3C7D"/>
    <rect x="70" y="220" width="320" height="24" fill="#0D3C7D"/>
  </g>
  <text x="96" y="225" class="step">01 · CHỐT BÀI TOÁN</text>
  <text x="96" y="282" class="head">Yêu cầu nghiệp vụ</text>
  <text x="96" y="322" class="body">• Thiếu / hết hạn / sai thông tin</text>
  <text x="96" y="353" class="body">• Phân biệt chặn duyệt và cảnh báo</text>
  <text x="96" y="384" class="body">• Chốt chỉ số thành công</text>
  <text x="96" y="423" class="tech">Owner: Business + AI Engineer</text>

  <!-- card 2 -->
  <g filter="url(#shadow)">
    <rect x="450" y="190" width="320" height="265" rx="22" fill="#FFFFFF"/>
    <rect x="450" y="190" width="320" height="54" rx="22" fill="#157A6E"/>
    <rect x="450" y="220" width="320" height="24" fill="#157A6E"/>
  </g>
  <text x="476" y="225" class="step">02 · CHUẨN BỊ DỮ LIỆU</text>
  <text x="476" y="282" class="head">Hồ sơ + quy định</text>
  <text x="476" y="322" class="body">• PDF/ảnh hồ sơ mẫu</text>
  <text x="476" y="353" class="body">• Quy định Markdown có phiên bản</text>
  <text x="476" y="384" class="body">• Luật YAML + đáp án kiểm thử</text>
  <text x="476" y="423" class="tech">PDF · JSON · Markdown · YAML</text>

  <!-- card 3 -->
  <g filter="url(#shadow)">
    <rect x="830" y="190" width="320" height="265" rx="22" fill="#FFFFFF"/>
    <rect x="830" y="190" width="320" height="54" rx="22" fill="#6C4AB6"/>
    <rect x="830" y="220" width="320" height="24" fill="#6C4AB6"/>
  </g>
  <text x="856" y="225" class="step">03 · THIẾT KẾ</text>
  <text x="856" y="282" class="head">Kiến trúc &amp; bảo mật</text>
  <text x="856" y="322" class="body">• Phân quyền và audit log</text>
  <text x="856" y="353" class="body">• Bằng chứng cho mọi kết luận</text>
  <text x="856" y="384" class="body">• Chống prompt injection</text>
  <text x="856" y="423" class="tech">IAM · Guardrails · HITL</text>

  <!-- card 4 -->
  <g filter="url(#shadow)">
    <rect x="1210" y="190" width="320" height="265" rx="22" fill="#FFFFFF"/>
    <rect x="1210" y="190" width="320" height="54" rx="22" fill="#C96A14"/>
    <rect x="1210" y="220" width="320" height="24" fill="#C96A14"/>
  </g>
  <text x="1236" y="225" class="step">04 · BUILD BACKEND</text>
  <text x="1236" y="282" class="head">Dịch vụ kiểm tra</text>
  <text x="1236" y="322" class="body">• Nhận yêu cầu từ MMS</text>
  <text x="1236" y="353" class="body">• Lấy hồ sơ và lưu kết quả</text>
  <text x="1236" y="384" class="body">• Trả evidence và feedback</text>
  <text x="1236" y="423" class="tech">Python · FastAPI · REST API</text>

  <!-- card 5 -->
  <g filter="url(#shadow)">
    <rect x="70" y="570" width="320" height="265" rx="22" fill="#FFFFFF"/>
    <rect x="70" y="570" width="320" height="54" rx="22" fill="#0D3C7D"/>
    <rect x="70" y="600" width="320" height="24" fill="#0D3C7D"/>
  </g>
  <text x="96" y="605" class="step">05 · BUILD AI PIPELINE</text>
  <text x="96" y="662" class="head">Đọc → tìm → kiểm tra</text>
  <text x="96" y="702" class="body">OCR đọc hồ sơ</text>
  <text x="96" y="733" class="body">RAG tìm quy định</text>
  <text x="96" y="764" class="body">Rules kiểm tra → AI giải thích</text>
  <text x="96" y="803" class="tech">Gemini multimodal + citations</text>

  <!-- card 6 -->
  <g filter="url(#shadow)">
    <rect x="450" y="570" width="320" height="265" rx="22" fill="#FFFFFF"/>
    <rect x="450" y="570" width="320" height="54" rx="22" fill="#157A6E"/>
    <rect x="450" y="600" width="320" height="24" fill="#157A6E"/>
  </g>
  <text x="476" y="605" class="step">06 · UX &amp; TÍCH HỢP MMS</text>
  <text x="476" y="662" class="head">Nhân viên xác nhận</text>
  <text x="476" y="702" class="body">• Hỏi “Hồ sơ thiếu gì?”</text>
  <text x="476" y="733" class="body">• Xem lỗi, nguồn và việc cần làm</text>
  <text x="476" y="764" class="body">• Nhân viên quyết định cuối</text>
  <text x="476" y="803" class="tech">Human-in-the-loop</text>

  <!-- card 7 -->
  <g filter="url(#shadow)">
    <rect x="830" y="570" width="320" height="265" rx="22" fill="#FFFFFF"/>
    <rect x="830" y="570" width="320" height="54" rx="22" fill="#6C4AB6"/>
    <rect x="830" y="600" width="320" height="24" fill="#6C4AB6"/>
  </g>
  <text x="856" y="605" class="step">07 · TEST &amp; ĐÁNH GIÁ</text>
  <text x="856" y="662" class="head">Đúng, an toàn, ổn định</text>
  <text x="856" y="702" class="body">• Unit / API / integration test</text>
  <text x="856" y="733" class="body">• Đo precision, recall, bỏ sót</text>
  <text x="856" y="764" class="body">• Red-team input và tài liệu độc</text>
  <text x="856" y="803" class="tech">Pytest · Security tests · Eval</text>

  <!-- card 8 -->
  <g filter="url(#shadow)">
    <rect x="1210" y="570" width="320" height="265" rx="22" fill="#FFFFFF"/>
    <rect x="1210" y="570" width="320" height="54" rx="22" fill="#C96A14"/>
    <rect x="1210" y="600" width="320" height="24" fill="#C96A14"/>
  </g>
  <text x="1236" y="605" class="step">08 · DEPLOY &amp; VẬN HÀNH</text>
  <text x="1236" y="662" class="head">Đưa lên server</text>
  <text x="1236" y="702" class="body">• Docker đóng gói ứng dụng</text>
  <text x="1236" y="733" class="body">• CI/CD tự test và triển khai</text>
  <text x="1236" y="764" class="body">• Theo dõi lỗi, tốc độ, chi phí</text>
  <text x="1236" y="803" class="tech">Docker · GitHub Actions · Logs</text>

  <!-- outcome -->
  <rect x="70" y="895" width="1460" height="105" rx="24" fill="#0B203C"/>
  <text x="105" y="938" class="footer">KẾT QUẢ: AI hỗ trợ kiểm tra — không tự duyệt hồ sơ</text>
  <text x="105" y="973" class="small">Mỗi phát hiện phải có: vấn đề · bằng chứng · quy định áp dụng · mức ảnh hưởng · bước xử lý tiếp theo</text>
</svg>