<title>MMS AI Checker | How it works</title><desc>AI helps review documents, but the employee makes the final decision</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#91a9c5"/></marker></defs>
<rect width="1340" height="1120" fill="#f5f9ff"/>
<rect x="43" y="16" width="1254" height="117" rx="19" fill="#0b2345"/>
<rect x="86" y="46" width="52" height="55" rx="8" fill="none" stroke="#ffffff" stroke-width="4"/>
<path d="M98 61 h25 M98 75 h18" stroke="#ffffff" stroke-width="4"/>
<circle cx="137" cy="95" r="17" fill="#f8fbff" stroke="#80baff" stroke-width="3"/>
<path d="M127 95 l7 7 14 -16" stroke="#167ddd" stroke-width="4" fill="none"/>
<line x1="169" y1="40" x2="169" y2="109" stroke="#9cb7d3" stroke-width="2"/>
<text x="197" y="72" font-size="40" font-weight="750" fill="white">MMS AI Checker | How it works</text>
<text x="197" y="105" font-size="22" fill="#cad8e9">AI helps review documents, but the employee makes the final decision</text>
<g><rect x="180" y="174" width="1002" height="104" rx="20" fill="#cedcf0" opacity=".42"/><rect x="176" y="170" width="1002" height="102" rx="20" fill="#fff" stroke="#afc3dd" stroke-width="1.7"/><rect x="199" y="178" width="105" height="86" rx="18" fill="#edf5ff"/><circle cx="93" cy="217" r="15" fill="none" stroke="#15355f" stroke-width="3.5"/><path d="M63 255 q30 -38 60 0" fill="none" stroke="#15355f" stroke-width="3.5"/><circle cx="115" cy="246" r="12" fill="#1686e8"/><path d="M109 246 h12 M115 240 v12" stroke="#fff" stroke-width="3"/><line x1="334" y1="184" x2="334" y2="259" stroke="#bdc9dc" stroke-width="2"/><text x="365" y="201" font-size="27" font-weight="700" fill="#0d213e">1. Employee submits a request</text><text x="365" y="230" font-size="20" fill="#42536b">Choose the application to review</text><text x="365" y="253" font-size="20" fill="#42536b">The system checks access permissions</text></g><line x1="668" y1="272" x2="668" y2="297" stroke="#91a9c5" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="180" y="304" width="1002" height="104" rx="20" fill="#cedcf0" opacity=".42"/><rect x="176" y="300" width="1002" height="102" rx="20" fill="#fff" stroke="#afc3dd" stroke-width="1.7"/><rect x="199" y="308" width="105" height="86" rx="18" fill="#edf5ff"/><rect x="77" y="320" width="48" height="63" rx="3" fill="white" stroke="#15355f" stroke-width="3.5"/><path d="M87 337 h28 M87 350 h24 M87 363 h18" stroke="#15355f" stroke-width="3"/><line x1="334" y1="314" x2="334" y2="389" stroke="#bdc9dc" stroke-width="2"/><text x="365" y="331" font-size="27" font-weight="700" fill="#0d213e">2. Load application and documents</text><text x="365" y="360" font-size="20" fill="#42536b">Load existing application data</text><text x="365" y="383" font-size="20" fill="#42536b">Accept PDF / image / demo TXT files</text></g><line x1="668" y1="402" x2="668" y2="427" stroke="#91a9c5" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="180" y="434" width="1002" height="104" rx="20" fill="#cedcf0" opacity=".42"/><rect x="176" y="430" width="1002" height="102" rx="20" fill="#fff" stroke="#afc3dd" stroke-width="1.7"/><rect x="199" y="438" width="105" height="86" rx="18" fill="#edf5ff"/><rect x="73" y="450" width="49" height="60" rx="6" fill="white" stroke="#15355f" stroke-width="3.5"/><text x="97" y="491" text-anchor="middle" font-size="28" font-weight="800" fill="#1785d4">AI</text><line x1="334" y1="444" x2="334" y2="519" stroke="#bdc9dc" stroke-width="2"/><text x="365" y="461" font-size="27" font-weight="700" fill="#0d213e">3. Read the document content</text><text x="365" y="490" font-size="20" fill="#42536b">Extract information from the documents</text><text x="365" y="513" font-size="20" fill="#42536b">Example: name, expiry date, ID number</text></g><line x1="668" y1="532" x2="668" y2="557" stroke="#91a9c5" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="180" y="564" width="1002" height="104" rx="20" fill="#cedcf0" opacity=".42"/><rect x="176" y="560" width="1002" height="102" rx="20" fill="#fff" stroke="#afc3dd" stroke-width="1.7"/><rect x="199" y="568" width="105" height="86" rx="18" fill="#edf5ff"/><path d="M58 587 Q80 581 94 597 Q108 581 132 587 L132 634 Q108 629 94 642 Q80 629 58 634 Z" fill="white" stroke="#15355f" stroke-width="3.5"/><path d="M94 597 v45 M70 599 h15 M70 609 h15" stroke="#15355f" stroke-width="2.5"/><line x1="334" y1="574" x2="334" y2="649" stroke="#bdc9dc" stroke-width="2"/><text x="365" y="591" font-size="27" font-weight="700" fill="#0d213e">4. Find related policies</text><text x="365" y="620" font-size="20" fill="#42536b">Search relevant rules and policies</text><text x="365" y="643" font-size="20" fill="#42536b">Retrieve the sections for comparison</text></g><line x1="668" y1="662" x2="668" y2="687" stroke="#91a9c5" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="180" y="694" width="1002" height="104" rx="20" fill="#cedcf0" opacity=".42"/><rect x="176" y="690" width="1002" height="102" rx="20" fill="#fff" stroke="#afc3dd" stroke-width="1.7"/><rect x="199" y="698" width="105" height="86" rx="18" fill="#edf5ff"/><path d="M94 708 L131 770 H57 Z" fill="#fff4df" stroke="#f39a21" stroke-width="4"/><path d="M94 732 v22" stroke="#f39a21" stroke-width="5"/><circle cx="94" cy="763" r="3.4" fill="#f39a21"/><line x1="334" y1="704" x2="334" y2="779" stroke="#bdc9dc" stroke-width="2"/><text x="365" y="721" font-size="27" font-weight="700" fill="#0d213e">5. Check and detect issues</text><text x="365" y="750" font-size="20" fill="#42536b">Compare application against the policies</text><text x="365" y="773" font-size="20" fill="#42536b">Detect: missing, expired or mismatched data</text></g><line x1="668" y1="792" x2="668" y2="817" stroke="#91a9c5" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="180" y="824" width="1002" height="104" rx="20" fill="#cedcf0" opacity=".42"/><rect x="176" y="820" width="1002" height="102" rx="20" fill="#fff" stroke="#afc3dd" stroke-width="1.7"/><rect x="199" y="828" width="105" height="86" rx="18" fill="#edf5ff"/><rect x="69" y="842" width="57" height="67" rx="5" fill="white" stroke="#15355f" stroke-width="3.5"/><rect x="83" y="834" width="28" height="13" rx="4" fill="#dceafc" stroke="#15355f" stroke-width="3"/><path d="M80 868 l6 6 l10 -12 M104 868 h13 M80 888 l6 6 l10 -12 M104 888 h13" stroke="#30a34b" stroke-width="3" fill="none"/><line x1="334" y1="834" x2="334" y2="909" stroke="#bdc9dc" stroke-width="2"/><text x="365" y="851" font-size="27" font-weight="700" fill="#0d213e">6. Return the result to the employee</text><text x="365" y="880" font-size="20" fill="#42536b">Show results, evidence and explanation</text><text x="365" y="903" font-size="20" fill="#42536b">The employee reviews and makes the decision</text></g>
<rect x="45" y="955" width="1250" height="126" rx="19" fill="#e1edfc"/>
<circle cx="107" cy="1022" r="33" fill="none" stroke="#1679d3" stroke-width="5"/>
<circle cx="107" cy="1022" r="15" fill="none" stroke="#1679d3" stroke-width="5"/>
<path d="M105 1024 L136 993" stroke="#1679d3" stroke-width="5"/>
<text x="171" y="1013" font-size="26" font-weight="750" fill="#102441">Key principles</text>
<line x1="462" y1="972" x2="462" y2="1066" stroke="#b5c7da" stroke-width="2"/>
<circle cx="487" cy="985" r="10" fill="#30ad54"/><path d="M482 985 l4 4 7 -9" stroke="white" stroke-width="2.8" fill="none"/><text x="508" y="992" font-size="21" fill="#17243d">AI supports review but never auto-approves applications</text><circle cx="487" cy="1016" r="10" fill="#30ad54"/><path d="M482 1016 l4 4 7 -9" stroke="white" stroke-width="2.8" fill="none"/><text x="508" y="1023" font-size="21" fill="#17243d">Results must be checked by a bank employee</text><circle cx="487" cy="1047" r="10" fill="#30ad54"/><path d="M482 1047 l4 4 7 -9" stroke="white" stroke-width="2.8" fill="none"/><text x="508" y="1054" font-size="21" fill="#17243d">The employee / bank makes the final decision</text>
<text x="45" y="1103" font-size="16" fill="#536781">Demo: FastAPI + document extraction + policy lookup + Rule Engine + AI explanation</text>
