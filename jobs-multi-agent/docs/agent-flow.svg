<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-label="Jobs Multi-Agent: Job Hunter đến Google Drive, Codex CV Tailor và ChatGPT Reporter">
